name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish
        run: dotnet publish -c Release -o publish

      - name: Prepare Pages output
        run: |
          base_path="${{ steps.pages.outputs.base_path }}"
          if [ -z "$base_path" ]; then
            href="/"
          else
            href="${base_path%/}/"
          fi
          sed -i "s|<base href=\"/\" />|<base href=\"${href}\" />|" publish/wwwroot/index.html
          touch publish/wwwroot/.nojekyll
          test -f publish/wwwroot/index.html
          test -f publish/wwwroot/404.html
          test -f publish/wwwroot/_framework/blazor.boot.json
          grep -q "base href=\"${href}\"" publish/wwwroot/index.html
          echo "base href is ${href}"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: publish/wwwroot

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
